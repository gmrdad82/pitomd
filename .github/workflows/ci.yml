name: Website CI

on:
  push:
    branches: [main]
  pull_request:

# actions:read lets the Slack notifier look up which step failed.
permissions:
  contents: read
  actions: read

jobs:
  # One job, so a failure produces exactly one Slack message (no double-posting).
  # Keep the job id `lint-and-audit` — it's the required status check on main.
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity gate)
        run: npm audit --audit-level=high

      - name: Prettier (all source)
        run: npx prettier --check .

      - name: ESLint (vanilla JS islands)
        run: npx eslint .

      - name: Stylelint (CSS)
        run: npx stylelint "src/styles/**/*.css"

      - name: Astro check (typing + template lint)
        run: npx astro check

      - name: Build verification
        run: npm run build

      - name: Lighthouse CI (a11y / SEO / best-practices gated; perf is a warning)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json

      # Slack only on FAILURE — successful CI is silent (no spam). The deploy
      # workflow posts the success/"deployed" notice, so the two never overlap.
      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ job.status }}
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          github-token: ${{ github.token }}
