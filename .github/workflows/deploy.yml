name: Deploy

# Builds the static site and publishes it to Cloudflare Pages when a version tag
# (v*.*.*) is pushed — TAG-GATED like pito. Pushes to main are still validated by
# Website CI but never auto-deploy; a release ships only when a new tag is cut
# (tag a commit that already went green on main). Also runs on manual dispatch.
# The build step is the deploy gate — a broken build fails the job and nothing
# ships. Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# SLACK_WEBHOOK (optional) posts a deploy notice.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pito-website

      # Slack only on SUCCESS — the deploy notice. A broken build fails the job
      # and this step is skipped, so no double-posting.
      - name: Notify Slack on deploy
        if: success()
        continue-on-error: true
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ job.status }}
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          github-token: ${{ github.token }}
