name: Deploy

# Builds the static site and publishes it to Cloudflare Pages AFTER Website CI
# passes on main (never on a red CI — owner rule), or on manual dispatch.
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# SLACK_WEBHOOK (optional) posts a deploy notice.
on:
  workflow_run:
    workflows: ["Website CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    # gate: only after a SUCCESSFUL Website CI run of MAIN (manual dispatch bypasses)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pito-website

      # Slack only on SUCCESS — the deploy notice. A broken build fails CI (which
      # sends the fail message) and this step is skipped, so no double-posting.
      - name: Notify Slack on deploy
        if: success()
        continue-on-error: true
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ job.status }}
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          github-token: ${{ github.token }}
