name: notify
on:
  push:
    tags: ["v*"]
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Tell Slack a commit arrived
        continue-on-error: true
        env:
          HOOK: ${{ secrets.SLACK_WEBHOOK }}
          MSG: ${{ github.event.head_commit.message }}
          WHO: ${{ github.event.head_commit.author.name }}
          URL: ${{ github.event.compare }}
        run: |
          [ -z "$HOOK" ] && exit 0
          SUBJECT=$(printf '%s' "$MSG" | head -n1)
          short_sha="${GITHUB_SHA:0:7}"
          TEXT=$(printf '%s\n%s\n%s' \
            ":incoming_envelope: *New copy* on \`main\`" \
            "${SUBJECT} (${WHO})." \
            "_pitomd · <${URL}|diff> · \`${short_sha}\`_")
          jq -n --arg t "$TEXT" '{text: $t}' | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$HOOK"
