  <rect width="1024" height="1024" fill="#1a0b2e"/>
  <g font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono',monospace" font-size="160" xml:space="preserve" font-weight="400">
    <text x="200" y="210"><tspan fill="#ffe066">██████</tspan><tspan fill="#8a6d1f">╗ </tspan></text>
    <text x="200" y="360"><tspan fill="#ffe066">██</tspan><tspan fill="#8a6d1f">╔══</tspan><tspan fill="#ffe066">██</tspan><tspan fill="#8a6d1f">╗</tspan></text>
    <text x="200" y="510"><tspan fill="#ffe066">██████</tspan><tspan fill="#8a6d1f">╔╝</tspan></text>
    <text x="200" y="660"><tspan fill="#ffe066">██</tspan><tspan fill="#8a6d1f">╔═══╝</tspan></text>
    <text x="200" y="810"><tspan fill="#ffe066">██</tspan><tspan fill="#8a6d1f">║</tspan></text>
